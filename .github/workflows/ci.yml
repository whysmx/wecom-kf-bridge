name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test and coverage
        run: go test ./... -count=1 -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: Strict coverage gate
        run: |
          go list ./... > packages.txt
          python3 scripts/check_coverage.py coverage.out --packages packages.txt
      - name: Coverage report
        run: go tool cover -func=coverage.out
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
