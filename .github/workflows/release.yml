name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Build release package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          dist="dist/${version}"
          mkdir -p "${dist}"
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          archive="${dist}/wecom-kf-bridge-${version}-${GOOS}-${GOARCH}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "${archive}${ext}" ./cmd/wecom-kf-bridge
          cp config.example.json "${dist}/"
          cp README.md "${dist}/"
          cp CHANGELOG.md "${dist}/"
          cp -r docs "${dist}/docs"
          if [ "${GOOS}" = "windows" ]; then
            (cd "${dist}" && 7z a "${archive##*/}.zip" . -xr!*.zip)
          else
            tar -C "${dist}" -czf "/tmp/${archive##*/}.tar.gz" .
            mv "/tmp/${archive##*/}.tar.gz" "${archive}.tar.gz"
          fi
          sha256sum "${archive}"* >> "${dist}/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ github.ref_name }}/*
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        run: scripts/release_notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/SHA256SUMS
